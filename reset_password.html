<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mosala — Nouveau mot de passe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0fdf4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: #f0fdf4;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 10px;
    }
    .logo h1 { color: #16a34a; font-size: 22px; font-weight: 700; }
    h2 { font-size: 22px; color: #111; margin-bottom: 8px; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 32px; line-height: 1.5; }

    .field { margin-bottom: 16px; position: relative; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .input-wrap { position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%;
      height: 52px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 0 48px 0 44px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      color: #111;
    }
    input:focus { border-color: #16a34a; }
    input.error { border-color: #ef4444; }
    .icon-left {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 18px; color: #16a34a;
    }
    .toggle-eye {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; font-size: 18px; color: #9ca3af;
      user-select: none;
    }
    .toggle-eye:hover { color: #16a34a; }

    /* Indicateur force mdp */
    .strength-bar {
      display: flex; gap: 4px; margin-top: 8px;
    }
    .strength-segment {
      height: 4px; flex: 1; border-radius: 2px;
      background: #e5e7eb; transition: background 0.3s;
    }
    .strength-label { font-size: 12px; color: #9ca3af; margin-top: 4px; }

    .error-msg {
      color: #ef4444; font-size: 13px;
      margin-bottom: 16px; display: none;
      background: #fef2f2; padding: 10px 14px;
      border-radius: 8px; border: 1px solid #fecaca;
    }
    .success-msg {
      color: #15803d; font-size: 14px;
      margin-bottom: 16px; display: none;
      background: #f0fdf4; padding: 12px 16px;
      border-radius: 10px; border: 1px solid #bbf7d0;
      text-align: center;
    }

    .btn {
      width: 100%; height: 52px;
      background: #16a34a; color: white;
      border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover { background: #15803d; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Succès final */
    .success-screen {
      text-align: center; display: none;
    }
    .success-screen .check {
      font-size: 64px; margin-bottom: 16px;
    }
    .success-screen h2 { color: #16a34a; margin-bottom: 8px; }
    .success-screen p { color: #6b7280; margin-bottom: 28px; }
    .btn-login {
      display: inline-block;
      background: #16a34a; color: white;
      padding: 14px 40px; border-radius: 12px;
      font-weight: 700; font-size: 16px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="card">
    <div id="form-screen">
      <div class="logo">
        <div class="logo-icon">🌿</div>
        <h1>Mosala</h1>
      </div>

      <h2>Nouveau mot de passe</h2>
      <p class="subtitle">Choisissez un mot de passe sécurisé d'au moins 6 caractères.</p>

      <div class="error-msg" id="error-msg"></div>

      <div class="field">
        <label>Nouveau mot de passe</label>
        <div class="input-wrap">
          <span class="icon-left">🔒</span>
          <input type="password" id="pwd" placeholder="Entrez votre mot de passe" oninput="checkStrength()">
          <span class="toggle-eye" onclick="toggleEye('pwd', 'eye1')" id="eye1">👁️</span>
        </div>
        <div class="strength-bar">
          <div class="strength-segment" id="s1"></div>
          <div class="strength-segment" id="s2"></div>
          <div class="strength-segment" id="s3"></div>
          <div class="strength-segment" id="s4"></div>
        </div>
        <div class="strength-label" id="strength-label"></div>
      </div>

      <div class="field">
        <label>Confirmer le mot de passe</label>
        <div class="input-wrap">
          <span class="icon-left">🔒</span>
          <input type="password" id="pwd-confirm" placeholder="Confirmez votre mot de passe">
          <span class="toggle-eye" onclick="toggleEye('pwd-confirm', 'eye2')" id="eye2">👁️</span>
        </div>
      </div>

      <div style="margin-bottom:24px;"></div>

      <button class="btn" id="btn-reset" onclick="resetPassword()">
        <div class="spinner" id="spinner"></div>
        <span id="btn-text">Confirmer</span>
      </button>
    </div>

    <!-- Écran succès -->
    <div class="success-screen" id="success-screen">
      <div class="check">✅</div>
      <h2>Mot de passe mis à jour !</h2>
      <p>Votre mot de passe a été changé avec succès. Vous pouvez maintenant vous connecter.</p>
      <a href="login.html" class="btn-login">Se connecter →</a>
    </div>
  </div>

  <script>
    const API_BASE = '/';
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email') || '';
    const otp   = params.get('otp')   || '';

    function toggleEye(inputId, eyeId) {
      const input = document.getElementById(inputId);
      const eye   = document.getElementById(eyeId);
      if (input.type === 'password') {
        input.type = 'text';
        eye.textContent = '🙈';
      } else {
        input.type = 'password';
        eye.textContent = '👁️';
      }
    }

    function checkStrength() {
      const pwd = document.getElementById('pwd').value;
      const segments = [document.getElementById('s'+i) for (i of [1,2,3,4])];
      let score = 0;
      if (pwd.length >= 6) score++;
      if (pwd.length >= 10) score++;
      if (/[A-Z]/.test(pwd) && /[0-9]/.test(pwd)) score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;

      const colors  = ['#ef4444', '#f97316', '#eab308', '#16a34a'];
      const labels  = ['Trop court', 'Faible', 'Moyen', 'Fort'];
      const segs    = [document.getElementById('s1'), document.getElementById('s2'),
                       document.getElementById('s3'), document.getElementById('s4')];
      const label   = document.getElementById('strength-label');

      segs.forEach((s, i) => {
        s.style.background = i < score ? colors[score - 1] : '#e5e7eb';
      });
      label.textContent = pwd.length > 0 ? labels[score - 1] || '' : '';
      label.style.color = score > 0 ? colors[score - 1] : '#9ca3af';
    }

    // Fix: boucle for...of dans les expressions nécessite une réécriture
    function getStrengthSegments() {
      return [1,2,3,4].map(i => document.getElementById('s'+i));
    }

    function setLoading(state) {
      document.getElementById('btn-reset').disabled = state;
      document.getElementById('spinner').style.display = state ? 'block' : 'none';
      document.getElementById('btn-text').textContent = state ? '' : 'Confirmer';
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('pwd').classList.add('error');
      document.getElementById('pwd-confirm').classList.add('error');
    }

    function clearError() {
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('pwd').classList.remove('error');
      document.getElementById('pwd-confirm').classList.remove('error');
    }

    async function resetPassword() {
      clearError();
      const pwd     = document.getElementById('pwd').value;
      const confirm = document.getElementById('pwd-confirm').value;

      if (pwd.length < 6) { showError('Le mot de passe doit faire au moins 6 caractères'); return; }
      if (pwd !== confirm) { showError('Les mots de passe ne correspondent pas'); return; }

      setLoading(true);
      try {
        const resp = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp, new_password: pwd })
        });

        if (resp.ok) {
          document.getElementById('form-screen').style.display = 'none';
          document.getElementById('success-screen').style.display = 'block';
        } else {
          const data = await resp.json();
          showError(data.detail || 'Erreur. Réessayez.');
        }
      } catch (e) {
        showError('Connexion impossible. Vérifiez votre internet.');
      } finally {
        setLoading(false);
      }
    }
  </script>
</body>
</html>
