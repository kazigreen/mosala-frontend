<div x-show="page==='login'" class="min-h-screen flex items-center justify-center" style="position:fixed;inset:0;z-index:100;overflow-y:auto;background:#fafafa;">

    <!-- ── Formulaire centré ── -->
    <div class="w-full flex items-center justify-center p-6 py-10">
    <div class="w-full max-w-md auth-fade-up" style="background:#ffffff;border-radius:20px;border:1px solid #ebebeb;padding:40px 36px;">

      <!-- Logo + badge -->
      <div class="flex flex-col items-center mb-7">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center mb-4 shadow-lg" style="background:linear-gradient(135deg,#059669,#10b981);">
          <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <!-- Badge sécurité -->
        <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium" style="background:rgba(16,185,129,.08);color:#059669;border:1px solid rgba(16,185,129,.2);">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
          Connexion 100% sécurisée
        </div>
      </div>

      <!-- Titre -->
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-[#0F172A] tracking-tight text-left">Bon retour</h2>
        <p class="text-gray-500 text-sm mt-2">Connecte-toi pour retrouver tes projets</p>
      </div>

      <form @submit.prevent="login()" class="space-y-4">

        <!-- Téléphone -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Téléphone</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
              <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
            </span>
            <input x-model="loginForm.telephone"
                   type="tel"
                   class="w-full rounded-xl pl-10 pr-4 py-3 text-sm text-[#0F172A] placeholder-gray-400 outline-none transition-all duration-200"
                   style="background:#F7F8FA;border:1.5px solid #EBEBEB;"
                   onfocus="this.style.border='1.5px solid #00B87C';this.style.background='#fff';"
                   onblur="this.style.border='1.5px solid #EBEBEB';this.style.background='#F7F8FA';"
                   placeholder="+243 810 000 000"
                   required />
          </div>
        </div>

        <!-- Mot de passe -->
        <div x-data="{ showPwd: false }">
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Mot de passe</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
              <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </span>
            <input x-model="loginForm.password"
                   :type="showPwd ? 'text' : 'password'"
                   class="w-full rounded-xl pl-10 pr-11 py-3 text-sm text-[#0F172A] placeholder-gray-400 outline-none transition-all duration-200"
                   style="background:#F7F8FA;border:1.5px solid #EBEBEB;"
                   onfocus="this.style.border='1.5px solid #00B87C';this.style.background='#fff';"
                   onblur="this.style.border='1.5px solid #EBEBEB';this.style.background='#F7F8FA';"
                   placeholder="••••••••"
                   required />
            <button type="button" @click="showPwd = !showPwd"
                    class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition">
              <svg x-show="!showPwd" class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg x-show="showPwd" class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember me + Forgot -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" x-model="rememberMe" class="w-4 h-4 rounded accent-[#00B87C] cursor-pointer"/>
            <span class="text-sm text-gray-500">Se souvenir de moi</span>
          </label>
          <button type="button" @click="page='forgot'" class="text-sm text-[#00B87C] hover:text-[#009E6A] font-semibold transition">Mot de passe oublié ?</button>
        </div>

        <!-- Bouton connexion -->
        <button type="submit"
                class="w-full text-white font-semibold rounded-xl py-3.5 text-sm transition-all duration-200 mt-2"
                style="background:linear-gradient(135deg,#00B87C,#00D68F);"
                onmouseover="this.style.opacity='0.92';this.style.transform='translateY(-1px)';"
                onmouseout="this.style.opacity='1';this.style.transform='translateY(0)';"
                :disabled="loading">
          <span x-show="!loading">Se connecter →</span>
          <span x-show="loading">⏳ Connexion...</span>
        </button>

      </form>

      <!-- Séparateur -->
      <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400 font-medium">ou</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <!-- Bouton Google -->
      <button type="button"
              @click="loginWithGoogle()"
              class="w-full flex items-center justify-center gap-3 rounded-xl py-3 text-sm font-medium text-gray-700 transition-all duration-200"
              style="border:1.5px solid #EBEBEB;background:#fff;"
              onmouseover="this.style.borderColor='#00B87C';this.style.background='#f9fffe';"
              onmouseout="this.style.borderColor='#EBEBEB';this.style.background='#fff';">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continuer avec Google
      </button>

      <!-- Lien inscription -->
      <p class="text-center text-sm text-gray-500 mt-6">
        Pas encore de compte ?
        <button @click="page='register'; window.scrollTo(0,0)" class="text-[#00B87C] hover:text-[#009E6A] font-semibold transition">S'inscrire</button>
      </p>

    </div>
    </div>
  </div>
