<div x-show="page==='forgot'" class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-10" style="position:fixed;inset:0;z-index:100;overflow-y:auto;">
    <div class="bg-white rounded-3xl shadow-xl p-10 w-full max-w-md">

      <!-- Logo -->
      <div class="flex justify-center mb-6">
        <div class="w-14 h-14 bg-[#F7FAF9] rounded-2xl flex items-center justify-center">
          <svg class="w-8 h-8 text-[#00B87C]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
      </div>

      <!-- Envoyé -->
      <div x-show="forgotSent" class="text-center">
        <div class="w-16 h-16 bg-[#F7FAF9] rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8 text-[#00B87C]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-[#0F172A] mb-2">Email envoyé !</h2>
        <p class="text-gray-500 text-sm mb-2">Vérifie ta boîte mail à :</p>
        <p class="text-[#00B87C] font-semibold mb-6" x-text="forgotEmail"></p>
        <p class="text-gray-400 text-xs mb-6">Le lien expire dans 1 heure. Vérifie aussi tes spams.</p>
        <button @click="page='login'; forgotSent=false; forgotEmail=''"
                class="w-full border border-gray-200 text-gray-600 font-semibold rounded-xl py-3 hover:bg-[#F7FAF9] transition text-sm">
          ← Retour à la connexion
        </button>
      </div>

      <!-- Formulaire -->
      <div x-show="!forgotSent">
        <div class="mb-8">
          <h2 class="text-2xl font-bold text-[#0F172A]">Mot de passe oublié ?</h2>
          <p class="text-gray-500 text-sm mt-1">Entre ton email pour recevoir un lien de réinitialisation.</p>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
              </span>
              <input x-model="forgotEmail" type="email"
                     class="w-full rounded-xl pl-11 pr-4 py-3 text-[#0F172A] placeholder-gray-400 style="background:#FAFAFA;border:1.5px solid transparent;box-shadow:0 0 0 1.5px #e2e8f0;" onfocus="this.style.boxShadow='0 0 0 2px #10b981, 0 0 0 4px rgba(16,185,129,.12)'" onblur="this.style.boxShadow='0 0 0 1.5px #e2e8f0'" focus:outline-none transition text-sm"
                     placeholder="jean@email.com" />
            </div>
          </div>

          <button type="button" @click="
              if(!forgotEmail) return;
              forgotLoading = true;
              fetch(API+'/auth/forgot-password', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({email: forgotEmail})
              }).then(r => r.json()).then(() => {
                page = 'otp';
              }).catch(() => {
                showToast('Erreur réseau, réessaie.', 'error');
              }).finally(() => { forgotLoading = false; })"
              class="w-full bg-[#00B87C] hover:bg-[#009E6A] text-white font-semibold rounded-xl py-3.5 transition disabled:opacity-50 text-sm shadow-sm"
              :disabled="forgotLoading">
            <span x-show="!forgotLoading">Envoyer le lien</span>
            <span x-show="forgotLoading">⏳ Envoi...</span>
          </button>

          <button @click="page='login'; window.scrollTo(0,0)"
                  class="w-full border border-gray-200 text-gray-600 font-semibold rounded-xl py-3 hover:bg-[#F7FAF9] transition text-sm">
            ← Retour à la connexion
          </button>
        </div>
      </div>
    </div>
  </div>
