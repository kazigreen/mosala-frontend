<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mosala — Mot de passe oublié</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0fdf4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon {
      width: 64px; height: 64px;
      background: #f0fdf4; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 28px; margin-bottom: 10px;
    }
    .logo h1 { color: #16a34a; font-size: 22px; font-weight: 700; }
    h2 { font-size: 22px; color: #111; margin-bottom: 8px; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 32px; line-height: 1.6; }

    .field { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .input-wrap { position: relative; }
    input {
      width: 100%; height: 52px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 0 16px 0 44px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      color: #111;
    }
    input:focus { border-color: #16a34a; }
    input.error { border-color: #ef4444; }
    .icon-left {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
    }
    .error-msg {
      color: #ef4444; font-size: 13px;
      background: #fef2f2; padding: 10px 14px;
      border-radius: 8px; border: 1px solid #fecaca;
      margin-bottom: 16px; display: none;
    }
    .btn {
      width: 100%; height: 52px;
      background: #16a34a; color: white;
      border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: #15803d; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .back-link {
      text-align: center; margin-top: 20px; font-size: 14px;
    }
    .back-link a {
      color: #16a34a; font-weight: 600; text-decoration: none;
    }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <h1>Mosala</h1>
    </div>

    <h2>Mot de passe oublié ?</h2>
    <p class="subtitle">
      Entrez votre adresse email. Nous vous enverrons un code de vérification à 6 chiffres.
    </p>

    <div class="error-msg" id="error-msg"></div>

    <div class="field">
      <label>Adresse email</label>
      <div class="input-wrap">
        <span class="icon-left">📧</span>
        <input type="email" id="email" placeholder="exemple@email.com"
          onkeydown="if(event.key==='Enter') sendOtp()">
      </div>
    </div>

    <button class="btn" id="btn-send" onclick="sendOtp()">
      <div class="spinner" id="spinner"></div>
      <span id="btn-text">Envoyer le code</span>
    </button>

    <div class="back-link">
      <a href="index.html">← Retour à la connexion</a>
    </div>
  </div>

  <script>
    const API_BASE = '';

    function setLoading(state) {
      document.getElementById('btn-send').disabled = state;
      document.getElementById('spinner').style.display = state ? 'block' : 'none';
      document.getElementById('btn-text').textContent = state ? '' : 'Envoyer le code';
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('email').classList.add('error');
    }

    async function sendOtp() {
      const email = document.getElementById('email').value.trim();
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('email').classList.remove('error');

      if (!email || !email.includes('@')) {
        showError('Entrez une adresse email valide');
        return;
      }

      setLoading(true);
      try {
        const resp = await fetch(`${API_BASE}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        if (resp.ok) {
          // Rediriger vers l'écran OTP
          window.location.href = `otp_verify.html?email=${encodeURIComponent(email)}`;
        } else {
          showError('Erreur serveur. Réessayez dans quelques instants.');
        }
      } catch (e) {
        showError('Connexion impossible. Vérifiez votre internet.');
      } finally {
        setLoading(false);
      }
    }
  </script>
</body>
</html>
