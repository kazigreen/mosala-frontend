<div x-show="activeTab==='marketplace'" class="min-h-screen pb-24" style="background:#F5F4F2;">

    <!-- ── Header sticky ── -->
    <div class="sticky top-0 z-10 px-4 pt-4 pb-3" style="background:#F5F4F2;">
      <div class="max-w-6xl mx-auto">

      <!-- Barre recherche -->
      <div class="flex items-center gap-2 px-3 py-2.5 rounded-2xl mb-3"
           style="background:#FFFFFF; border:none; box-shadow:0 2px 12px rgba(15,23,42,0.07);">
        <svg viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2.5" class="w-4 h-4 flex-shrink-0">
          <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" x-model="rechercheProjet"
               @input.debounce.400ms="loadProjets()"
               placeholder="Rechercher une mission..."
               class="flex-1 text-sm bg-transparent outline-none"
               style="color:#0F172A; font-size:13px;"
               autocomplete="off"/>
        <button x-show="rechercheProjet"
                @click="rechercheProjet=''; loadProjets()"
                class="flex-shrink-0" style="color:#CBD5E1;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-3.5 h-3.5">
            <path stroke-linecap="round" d="M6 18 18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Filtres statut -->
      <div class="flex gap-2 overflow-x-auto pb-0.5" style="scrollbar-width:none;">

        <!-- Disponibles -->
        <button @click="filtreStatut='en_attente'; loadProjets()"
                class="flex-shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all duration-200"
                :style="filtreStatut==='en_attente' ? 'background:#F59E0B;color:white;box-shadow:0 3px 12px rgba(245,158,11,0.35);' : 'background:#FFFFFF;color:#64748B;border:none;box-shadow:0 2px 8px rgba(15,23,42,0.07);'">
          <span class="relative flex w-1.5 h-1.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-60"
                  :style="filtreStatut==='en_attente' ? 'background:rgba(255,255,255,0.8);' : 'background:#F59E0B;'"></span>
            <span class="relative inline-flex rounded-full w-1.5 h-1.5"
                  :style="filtreStatut==='en_attente' ? 'background:white;' : 'background:#F59E0B;'"></span>
          </span>
          Disponibles
        </button>

        <!-- En cours -->
        <button @click="filtreStatut='en_cours'; loadProjets()"
                class="flex-shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all duration-200"
                :style="filtreStatut==='en_cours' ? 'background:#3B82F6;color:white;box-shadow:0 3px 12px rgba(59,130,246,0.35);' : 'background:#FFFFFF;color:#64748B;border:none;box-shadow:0 2px 8px rgba(15,23,42,0.07);'">
          <span class="relative flex w-1.5 h-1.5">
            <span class="animate-pulse absolute inline-flex h-full w-full rounded-full opacity-60"
                  :style="filtreStatut==='en_cours' ? 'background:rgba(255,255,255,0.8);' : 'background:#3B82F6;'"></span>
            <span class="relative inline-flex rounded-full w-1.5 h-1.5"
                  :style="filtreStatut==='en_cours' ? 'background:white;' : 'background:#3B82F6;'"></span>
          </span>
          En cours
        </button>

        <!-- Terminés -->
        <button @click="filtreStatut='termine'; loadProjets()"
                class="flex-shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all duration-200"
                :style="filtreStatut==='termine' ? 'background:#64748B;color:white;box-shadow:0 3px 10px rgba(100,116,139,0.30);' : 'background:#FFFFFF;color:#64748B;border:none;box-shadow:0 2px 8px rgba(15,23,42,0.07);'">
          <span class="w-1.5 h-1.5 rounded-full flex-shrink-0"
                :style="filtreStatut==='termine' ? 'background:white;' : 'background:#94A3B8;'"></span>
          Terminés
        </button>

        <!-- Tous -->
        <button @click="filtreStatut=''; loadProjets()"
                class="flex-shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all duration-200"
                :style="filtreStatut==='' ? 'background:#0F172A;color:white;box-shadow:0 3px 12px rgba(15,23,42,0.25);' : 'background:#FFFFFF;color:#64748B;border:none;box-shadow:0 2px 8px rgba(15,23,42,0.07);'">
          <span class="relative flex w-1.5 h-1.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-60"
                  :style="filtreStatut==='' ? 'background:rgba(255,255,255,0.8);' : 'background:#CBD5E1;'"></span>
            <span class="relative inline-flex rounded-full w-1.5 h-1.5"
                  :style="filtreStatut==='' ? 'background:white;' : 'background:#CBD5E1;'"></span>
          </span>
          Tous
          <span x-show="projets.length > 0" x-text="'('+projets.length+')')" class="opacity-70"></span>
        </button>

      </div>
      </div><!-- /max-w header -->
    </div><!-- /sticky header -->

    <!-- ── Contenu ── -->
    <div class="px-4 max-w-6xl mx-auto">

      <!-- Skeleton loading -->
      <div x-show="loadingProjets" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
        <template x-for="i in 4" :key="i">
          <div class="rounded-2xl p-4 animate-pulse" style="background:#FFFFFF; border:none; box-shadow:0 2px 12px rgba(15,23,42,0.06);">
            <div class="flex items-center gap-2 mb-3">
              <div class="w-8 h-8 rounded-xl" style="background:#F1F5F9;"></div>
              <div>
                <div class="h-3 w-20 rounded mb-1" style="background:#F1F5F9;"></div>
                <div class="h-2 w-14 rounded" style="background:#F1F5F9;"></div>
              </div>
            </div>
            <div class="h-4 w-3/4 rounded mb-2" style="background:#F1F5F9;"></div>
            <div class="h-3 w-full rounded mb-1" style="background:#F1F5F9;"></div>
            <div class="h-3 w-2/3 rounded" style="background:#F1F5F9;"></div>
          </div>
        </template>
      </div>

      <!-- État vide -->
      <div x-show="!loadingProjets && projets.length === 0"
           class="rounded-2xl p-6 text-center" style="background:#FFFFFF; border:1.5px dashed #E2E0DC; box-shadow:0 2px 12px rgba(15,23,42,0.05);">
        <div class="w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-3"
             style="background:#F0FBF7; border:1px solid rgba(0,184,124,0.15);">
          <svg viewBox="0 0 24 24" fill="none" stroke="#00B87C" stroke-width="2" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 0 0 .75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 0 0-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0 1 12 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 0 1-.673-.38m0 0A2.18 2.18 0 0 1 3 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 0 1 3.413-.387m7.5 0V5.25A2.25 2.25 0 0 0 13.5 3h-3a2.25 2.25 0 0 0-2.25 2.25v.894m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
          </svg>
        </div>
        <p class="text-sm font-bold mb-1" style="color:#0F172A;">Aucune mission trouvée</p>
        <p class="text-xs mb-4" style="color:#94A3B8;">Essaie un autre filtre ou reviens plus tard</p>
        <button @click="filtreStatut=''; rechercheProjet=''; loadProjets()"
                style="padding:10px 24px; border-radius:12px; border:none;
                       background:linear-gradient(135deg,#00B87C,#00D68F);
                       color:white; font-size:12px; font-weight:700; cursor:pointer;">
          Voir toutes les missions
        </button>
      </div>

      <!-- Liste missions -->
      <div x-show="!loadingProjets && projets.length > 0" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
        <template x-for="p in projets" :key="p.id">
          <div @click="openProjet(p)"
               class="rounded-2xl overflow-hidden cursor-pointer transition-all duration-200 flex"
               style="background:#FFFFFF; border:none; box-shadow:0 2px 16px rgba(15,23,42,0.08);"
               onmouseover="this.style.boxShadow='0 6px 24px rgba(15,23,42,0.11)';this.style.transform='translateY(-2px)'"
               onmouseout="this.style.boxShadow='0 2px 16px rgba(15,23,42,0.08)';this.style.transform='translateY(0)'">

            <!-- Bande colorée gauche selon statut -->
            <div class="w-1 flex-shrink-0"
                 :style="p.statut==='en_attente' ? 'background:#CBD5E1' : p.statut==='en_cours' ? 'background:#3B82F6' : 'background:#10B981'"></div>

            <div class="flex-1">



            <div class="p-5">

              <!-- Badge + date en haut -->
              <div class="flex items-center justify-between mb-2.5">
                <span class="text-[10px] font-medium" style="color:#64748B;"
                      x-text="'\uD83D\uDD52 ' + timeAgo(p.created_at)"></span>
                <span class="inline-flex items-center gap-1 text-[9px] font-bold px-2 py-0.5 rounded-lg"
                      :style="p.is_new===true && p.statut==='en_attente'
                        ? 'background:#0F172A;color:#fff;'
                        : p.statut==='en_attente'
                          ? 'background:#F1F5F9;color:#64748B;border:1px solid #E2E8F0;'
                          : p.statut==='en_cours'
                            ? 'background:#EFF6FF;color:#1D4ED8;border:1px solid rgba(59,130,246,0.25);'
                            : 'background:#F8FAFC;color:#64748B;border:1px solid #E8ECF4;'"
                      x-html="badgeStatut(p)"></span>
              </div>

              <!-- Client info -->
              <div class="flex items-center gap-2 mb-3">
                <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 text-xs font-black"
                     :style="'background:'+avatarColor((p.client_prenom||'')+(p.client_nom||''))+';color:#1e293b;'">
                  <span x-text="((p.client_prenom||'?')[0]+(p.client_nom||'?')[0]).toUpperCase()"></span>
                </div>
                <div class="min-w-0 flex-1">
                  <p class="text-xs font-bold truncate" style="color:#0F172A;"
                     x-text="(p.client_prenom||'') + ' ' + (p.client_nom||'')"></p>
                  <div class="flex items-center gap-1 mt-0.5 flex-wrap">
                    <span x-show="p.client_note > 0" class="text-[9px] font-bold" style="color:#F59E0B;"
                          x-text="'\u2605 ' + Number(p.client_note).toFixed(1)"></span>
                    <span x-show="!p.client_note" class="text-[9px] font-medium" style="color:#64748B;">Nouveau client</span>
                    <span x-show="p.client_projets > 0" class="text-[9px]" style="color:#94A3B8;">·</span>
                    <span x-show="p.client_projets > 0" class="text-[9px] font-medium" style="color:#64748B;"
                          x-text="p.client_projets + ' projet' + (p.client_projets > 1 ? 's' : '')"></span>
                    <span x-show="p.client_verification > 0" class="text-[9px] font-bold" style="color:#64748B;">· ✓ Vérifié</span>
                    <span x-show="p.client_is_pro" class="text-[9px] font-bold px-1 py-0.5 rounded" style="background:#fef9c3;color:#b45309;">🏆 Pro</span>
                  </div>
                </div>
              </div>

              <!-- Titre mission -->
              <h3 class="text-base font-black mb-2 leading-snug" style="color:#0F172A; word-break:break-word; overflow-wrap:break-word; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;"
                  x-text="p.titre"></h3>

              <!-- Description courte -->
              <p class="text-xs leading-relaxed mb-4" style="color:#64748B;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;" style="color:#64748B;"
                 x-text="p.description || 'Aucune description fournie.'"></p>

              <!-- Tags -->
              <div x-show="p.tags && (Array.isArray(p.tags) ? p.tags.length > 0 : String(p.tags).trim().length > 0)"
                   class="flex flex-wrap gap-1 mb-3">
                <template x-for="tag in (Array.isArray(p.tags) ? p.tags : String(p.tags).split(',')).filter(t=>t.trim()).slice(0,3)" :key="tag">
                  <span class="text-[9px] font-semibold px-2 py-0.5 rounded-lg whitespace-nowrap"
                        style="background:#F3F4F6; color:#6B7280; border:none;"
                        x-text="tag.trim()"></span>
                </template>
              </div>

              <!-- Footer card: budget + candidats + bouton -->
              <div class="flex items-center justify-between pt-2.5"
                   style="border-top:1px solid #F1F5F9;">

                <!-- Budget badge vert -->
                <div class="flex items-center gap-1.5 px-2 py-1.5 rounded-xl"
                     style="background:#fff; border:1px solid #D1FAE5;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" class="w-3.5 h-3.5 flex-shrink-0">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
                  </svg>
                  <span class="text-base font-black" style="color:#00B87C;"
                        x-text="p.budget ? new Intl.NumberFormat('fr-FR').format(p.budget) + ' ' + (p.devise||'USD') : 'À négocier'"></span>
                </div>

                <!-- Candidats -->
                <div class="flex items-center gap-1">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" class="w-3 h-3">
                    <path stroke-linecap="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0z"/>
                  </svg>
                  <span class="text-[10px] font-semibold" style="color:#94A3B8;"
                        x-text="(p.nb_candidatures||0) + ' candidat' + ((p.nb_candidatures||0)>1?'s':'')"></span>
                </div>
<!-- Bouton postuler -->
                <button x-show="p.statut==='en_attente'"
                        @click.stop="openProjet(p)"
                        class="relative overflow-hidden flex items-center gap-1.5 font-black text-white border-none cursor-pointer transition-all duration-200"
                        style="padding:9px 16px; border-radius:14px; font-size:11px;
                               background:linear-gradient(135deg,#00B87C 0%,#00A86B 100%);
                               box-shadow:0 4px 14px rgba(0,184,124,0.45), 0 1px 3px rgba(0,0,0,0.10);
                               letter-spacing:0.02em;"
                        onmouseover="this.style.transform='translateY(-1px) scale(1.03)';this.style.boxShadow='0 6px 20px rgba(0,184,124,0.55), 0 2px 6px rgba(0,0,0,0.12)'"
                        onmouseout="this.style.transform='translateY(0) scale(1)';this.style.boxShadow='0 4px 14px rgba(0,184,124,0.45), 0 1px 3px rgba(0,0,0,0.10)'"
                        onmousedown="this.style.transform='scale(0.97)'"
                        onmouseup="this.style.transform='translateY(-1px) scale(1.03)'">
                  <!-- Shimmer -->
                  <span class="absolute inset-0 opacity-0 hover:opacity-100 transition-opacity duration-300"
                        style="background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.18) 50%,transparent 60%); pointer-events:none;"></span>
                  <!-- Icône éclair -->
                  <svg viewBox="0 0 24 24" fill="currentColor" style="width:11px;height:11px;flex-shrink:0;">
                    <path d="M13 2L4.09 12.97A1 1 0 005 14.5h5.5L11 22l8.91-10.97A1 1 0 0019 9.5H13.5L13 2z"/>
                  </svg>
                  Postuler
                  <!-- Flèche animée -->
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:10px;height:10px;flex-shrink:0;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
                  </svg>
                </button>
              </div>

            </div><!-- /flex-1 -->
          </div><!-- /carte -->
        </template>

        <!-- Fin de liste -->
        <div x-show="projets.length >= 5" class="text-center py-4">
          <p class="text-[10px]" style="color:#CBD5E1;">— {{ projets.length }} missions affichées —</p>
        </div>
      </div>

    </div>
  </div>
