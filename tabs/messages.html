                  <svg class="w-3.5 h-3.5 text-[#00B87C]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                </span>
                Contexte projet visible

              <div class="flex items-center gap-2.5 text-sm text-gray-600">
                <span class="w-6 h-6 rounded-full bg-[#00B87C]/10 flex items-center justify-center flex-shrink-0">
                  <svg class="w-3.5 h-3.5 text-[#00B87C]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                </span>
                Escrow sécurisé intégré
              </div>
            </div>
          </div>

                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
              </button>
              <!-- Avatar -->
              <div class="relative flex-shrink-0">
                <div class="w-11 h-11 rounded-full bg-gradient-to-br from-[#00B87C] to-[#00956a] flex items-center justify-center text-white font-bold text-base shadow-md"

              </div>
              <!-- Nom + projet + badge vérifié -->

                <div class="flex items-center gap-1.5 flex-wrap">
                  <p class="font-bold text-gray-900 text-sm leading-tight truncate" x-text="activeConv.nom_interlocuteur || 'Inconnu'"></p>

                    <svg class="w-2.5 h-2.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                    Vérifié

                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>

                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>

                         }">
                      <span x-text="activeConv.projet_statut === 'en_cours' ? '🟢' : activeConv.projet_statut === 'en_attente' ? '🟡' : '⚫'"></span>
                      <span x-text="activeConv.projet_statut === 'en_cours' ? 'Mission active' : activeConv.projet_statut === 'en_attente' ? 'En attente' : 'Terminée'"></span>
                    </div>

                </div>

                  <div class="flex justify-end"><div class="h-10 w-40 bg-green-100 rounded-2xl animate-pulse"></div></div>
                  <div class="flex justify-start"><div class="h-10 w-52 bg-gray-200 rounded-2xl animate-pulse"></div></div>
                  <div class="flex justify-end"><div class="h-10 w-36 bg-green-100 rounded-2xl animate-pulse"></div></div>
                </div>
              </template>

              <template x-if="!msgLoading">
                <div class="space-y-1">
                  <template x-if="!convMessages || convMessages.length === 0">

                      <p class="text-xs mt-1">Sois le premier à écrire 👋</p>
                    </div>
                  </template>
                  <template x-for="(msg, idx) in (convMessages || [])" :key="msg.id">
                    <div class="flex mb-1" :class="msg.sender_id === user.id ? 'justify-end' : 'justify-start'">
                      <div class="max-w-[72%]">

                        <!-- Bulle texte -->
                        <template x-if="msg.type_message === 'texte' || !msg.type_message">
                          <div class="px-4 py-2.5 text-sm leading-relaxed shadow-sm"
                               :class="msg.sender_id === user.id
                                 ? 'bg-[#00B87C] text-white rounded-t-2xl rounded-bl-2xl rounded-br-sm'
                                 : 'bg-white text-gray-800 border border-gray-100 rounded-t-2xl rounded-br-2xl rounded-bl-sm'"

                        </template>

                        <!-- Bulle image -->
                        <template x-if="msg.type_message === 'image'">
                          <div class="overflow-hidden shadow-sm"
                               :class="msg.sender_id === user.id
                                 ? 'rounded-t-2xl rounded-bl-2xl rounded-br-sm'
                                 : 'rounded-t-2xl rounded-br-2xl rounded-bl-sm'">
                            <img :src="(msg.message||'').split('\n').pop()"
                                 class="max-w-[220px] block cursor-pointer hover:opacity-95 transition-opacity"

                        </template>

                             class="flex items-center gap-3 px-4 py-3 shadow-sm hover:opacity-90 transition-opacity no-underline"

                               ? 'bg-[#00B87C] text-white rounded-t-2xl rounded-bl-2xl rounded-br-sm'
                               : 'bg-white border border-gray-100 text-gray-800 rounded-t-2xl rounded-br-2xl rounded-bl-sm'">

                            </div>
                            <div class="min-w-0">
                              <p class="text-xs font-semibold truncate" x-text="(msg.message||'').split('/').pop()"></p>

                          </template>
                        </div>

                      </div>
                    </div>
                  </template>
                  <!-- Indicateur "est en train d'écrire" -->
                  <div x-show="peerTyping" class="flex justify-start mt-1">
                    <div class="flex items-center gap-2">
                      <div class="w-7 h-7 rounded-full bg-gradient-to-br from-[#00B87C] to-[#00956a] flex items-center justify-center text-white text-xs font-bold flex-shrink-0"
                           x-text="activeConv ? (activeConv.nom_interlocuteur||'?').trim().charAt(0).toUpperCase() : '?'"></div>
                      <div class="bg-white border border-gray-100 rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm">
                        <div class="flex items-center gap-1">
                          <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:0ms"></span>
                          <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:150ms"></span>
                          <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:300ms"></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </template>

            </div>

            <!-- ZONE SAISIE -->
            <!-- ZONE SAISIE -->
            <div class="px-4 py-3 bg-white border-t border-gray-100 flex-shrink-0">
              <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-2xl px-3 py-2 focus-within:border-[#00B87C] focus-within:ring-2 focus-within:ring-[#00B87C]/20 transition-all">

                <!-- Piece jointe -->
                <label class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-[#00B87C] hover:bg-[#00B87C]/10 transition-colors cursor-pointer">
                  <input type="file" class="hidden" accept="image/*,.pdf,.doc,.docx,.txt" @change="uploadFile($event, activeConv.id)" />
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                </label>

                <!-- Input -->
                <textarea x-model="newMessage"
                          @keydown.enter.prevent="if(!$event.shiftKey && newMessage.trim()) sendMessage()"
                          @input="$el.style.height='28px'; $el.style.height=$el.scrollHeight+'px'; signalTyping()"
                          rows="1"
                          placeholder="Ecrire un message..."
                          class="flex-1 bg-transparent resize-none text-sm text-gray-800 placeholder-gray-400 focus:outline-none"
                          style="min-height:28px;max-height:120px;"></textarea>

                <!-- Emoji -->
                <button class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-yellow-500 transition-colors">
                  <span class="text-lg leading-none">&#x1F60A;</span>
                </button>

                <!-- Envoyer -->
                <button @click="sendMessage()"
                        :disabled="!newMessage || !newMessage.trim() || msgSending"
                        :class="newMessage && newMessage.trim() && !msgSending ? 'bg-[#00B87C] hover:bg-[#00956a] text-white shadow-sm' : 'bg-gray-200 text-gray-400 cursor-not-allowed'"
                        class="flex-shrink-0 w-9 h-9 flex items-center justify-center rounded-full transition-all duration-200">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                </button>

              </div>
            </div>
          </div>
        </template>

      </div>
    </div>

  </div><!-- /app principale -->
