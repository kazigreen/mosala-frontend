<div x-show="activeTab==='nouveau'" class="p-4">
      <div class="card p-6">
        <h2 class="text-xl font-black text-kv-dark mb-1">📋 Publier un projet</h2>
        <p class="text-gray-500 text-sm mb-5">Décris ton besoin — les freelances te trouveront</p>

        <form @submit.prevent="createProjet()">
          <div class="mb-4">
            <label class="text-xs font-semibold text-gray-600 mb-1 block">Titre du projet *</label>
            <input x-model="projetForm.titre" class="input"
                   placeholder="Ex: Électricien pour installation à Gombe" required />
          </div>

          <div class="mb-4">
            <label class="text-xs font-semibold text-gray-600 mb-1 block">Description</label>
            <textarea x-model="projetForm.description" class="input" rows="4"
                      placeholder="Décris les détails, le lieu, les délais..."></textarea>
          </div>

          <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
              <label class="text-xs font-semibold text-gray-600 mb-1 block">Budget</label>
              <input x-model="projetForm.budget" type="number" class="input" placeholder="50000" />
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-600 mb-1 block">Devise</label>
              <select x-model="projetForm.devise" class="input">
                <option value="GNF">GNF</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="CDF">CDF</option>
              </select>
            </div>
          </div>

          <!-- Jalons -->
          <div class="mb-4 bg-kv-bg rounded-xl p-3">
            <div class="flex justify-between items-center mb-2">
              <label class="text-xs font-semibold text-gray-600">🔒 Jalons Escrow</label>
              <button type="button" @click="addJalon()" class="text-kv-green text-xs font-bold">+ Ajouter</button>
            </div>
            <p class="text-xs text-gray-400 mb-2">Découpe le paiement en étapes sécurisées</p>

            <div class="space-y-2">
              <template x-for="(j, i) in projetForm.jalons" :key="i">
                <div class="flex gap-2 items-center">
                  <input x-model="j.titre" class="input flex-1 text-sm" :placeholder="'Jalon ' + (i+1)" />
                  <input x-model="j.montant" type="number" class="input w-24 text-sm" placeholder="Montant" />
                  <button type="button" @click="projetForm.jalons.splice(i,1)"
                          class="text-red-400 hover:text-red-600 text-lg">×</button>
                </div>
              </template>
              <div x-show="projetForm.jalons.length === 0" class="text-xs text-gray-400 text-center py-2">
                Aucun jalon — paiement en une fois
              </div>
            </div>
          </div>

          <button type="submit" class="btn-primary" :disabled="loading">
            <span x-show="!loading">🚀 Publier le projet</span>
            <span x-show="loading">⏳ Publication...</span>
          </button>
        </form>
      </div>
    </div>
